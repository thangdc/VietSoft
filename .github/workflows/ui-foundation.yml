name: UI Foundation

on:
  pull_request:
    branches:
      - thangdinh/ui-foundation
  push:
    branches:
      - thangdinh/ui-foundation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
